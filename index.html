       <div class="carousel-card" id="carousel" role="region" aria-label="Carrossel de destinos de viagem">
  <div class="card-header">
    <h2>Próximos destinos</h2>
    <span>Embarque já</span>
  </div>

    <div class="track" id="track"></div>
  </div>

    <div class="arrows">
      <button class="arrow-btn" id="prevBtn" aria-label="Anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="arrow-btn" id="nextBtn" aria-label="Próximo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </div>

</div>
</div>
<div class="padrao">
  <div id="img-container1">

  </div>

  <h2>Exemplo de Roteiro</h2>

  <br>

  </div> 
</div>
