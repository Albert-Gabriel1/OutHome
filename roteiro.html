<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roteiro | OutHome</title>
  <link rel="stylesheet" href="estilo.css">
  <style>
    .editor { max-width:1100px; margin:30px auto; }
    .editor form, .dia-card {
      background:#fff; padding:20px; border-radius:12px; margin-bottom:18px;
      box-shadow:0 2px 10px rgba(0,0,0,.1);
    }
    .editor form { display:grid; gap:10px; }
    .editor input { padding:10px; border:1px solid #4F8A70; border-radius:6px; }
    .editor button { border:0; border-radius:6px; padding:10px 14px; cursor:pointer; }
    .editor button[type=submit] { background:#164A41; color:#fff; }
    .dia-cabecalho { display:flex; justify-content:space-between; gap:10px; align-items:center; }
    .dia-card ul { padding-left:22px; }
    .btn-excluir, .btn-excluir-atividade { background:#d96f1f; color:#fff; }
    .btn-excluir-atividade { border:0; padding:4px 8px; border-radius:4px; cursor:pointer; }
    #editor-mensagem { color:#c0392b; }
  </style>
</head>
<body>
<header id="inicio">
        <a href="login.html" id="login">Login</a>
        <menu>
            <img src="img/Logo agência de viagens minimalista azul.png" alt="Logo da OutHome" id="logo">
            <a href="#"><img src="img/suporte.png" alt="" class="icon">Central de Ajuda</a>
        </menu>
        <nav>
            <a href="index.html">Explorar</a>
            <a href="about.html">Sobre Nós</a>
            <a href="premium.html">Versão Premium</a>
            <a href="meus_projetos.html">Meus Projetos</a>
            <a href="contact.html" aria-current="page">Contato</a>
        </nav>
    </header>

<main>
  <section class="editor">
    <a href="meus_projetos.html">← Voltar aos projetos</a>
    <h1 id="roteiro-titulo">Carregando...</h1>
    <p id="roteiro-datas"></p>

    <form id="dia-form">
      <h2>Adicionar dia</h2>
      <label>Data</label>
      <input id="dia-data" type="date" required>
      <label>Ordem</label>
      <input id="dia-ordem" type="number" min="1" required>
      <button type="submit">Adicionar dia</button>
    </form>

    <form id="atividade-form">
      <h2>Adicionar atividade</h2>
      <label>Dia</label>
      <select id="atividade-dia" name="dia"></select>
      <label>Título</label>
      <input name="titulo" required placeholder="Ex.: Visitar Coliseu">
      <label>Horário</label>
      <input name="horario" type="time">
      <label>Custo estimado</label>
      <input name="custo_estimado" type="number" min="0" step="0.01" value="0">
      <label>Categoria</label>
      <input name="categoria" placeholder="Ex.: Passeio">
      <button type="submit">Adicionar atividade</button>
    </form>

    <p id="editor-mensagem"></p>
    <h2>Seu roteiro</h2>
    <div id="dias-container"></div>
  </section>
</main>

<script src="api.js"></script>
<script src="js/roteiro.js"></script>
</body>
</html>
